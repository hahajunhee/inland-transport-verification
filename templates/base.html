<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}내륙운송정산검증{% endblock %} v{{ version }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%A7%AE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/css/style.css?v=20260505" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">내륙운송정산검증 시스템</div>
    <div class="nav-links">
      <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">대시보드</a>
      <a href="/rate-register" class="nav-link {% if request.url.path == '/rate-register' %}active{% endif %}">요율등록</a>
      <a href="/checklist" class="nav-link {% if request.url.path == '/checklist' %}active{% endif %}">1단계_체크리스트 검증</a>
      <a href="/verification" class="nav-link {% if request.url.path == '/verification' %}active{% endif %}">2단계_정산검증</a>
      <a href="/mobis" class="nav-link {% if request.url.path == '/mobis' %}active{% endif %}">3단계_모비스검증</a>
    </div>
  </nav>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
